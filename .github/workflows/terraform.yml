name: Terraform

on:
  pull_request:
    paths:
      - ".github/workflows/terraform.yml"
      - "app/**"
      - "bootstrap/**"
      - "infrastructure/**"
      - "modules/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/terraform.yml"
      - "app/**"
      - "bootstrap/**"
      - "infrastructure/**"
      - "modules/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.repository }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize bootstrap without a backend
        run: terraform -chdir=bootstrap init -backend=false -input=false

      - name: Validate bootstrap
        run: terraform -chdir=bootstrap validate

      - name: Test deployment permissions without AWS access
        run: terraform -chdir=bootstrap test

      - name: Initialize infrastructure without a backend
        run: terraform -chdir=infrastructure init -backend=false -input=false

      - name: Validate infrastructure
        run: terraform -chdir=infrastructure validate

      - name: Test HTTPS infrastructure without AWS access
        run: terraform -chdir=infrastructure test

  deploy:
    name: Plan and apply infrastructure
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_hosted_zone_id: ${{ vars.HOSTED_ZONE_ID || 'Z09698437FJB59WM71X' }}
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME || 'panroman.pl' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Initialize remote state
        run: |
          terraform -chdir=infrastructure init \
            -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="region=$AWS_REGION"

      - name: Create deployment plan
        run: terraform -chdir=infrastructure plan -input=false -out=tfplan

      - name: Apply deployment plan
        run: terraform -chdir=infrastructure apply -input=false -auto-approve tfplan

      - name: Publish Terraform outputs
        run: |
          {
            echo "### Terraform outputs"
            echo '~~~text'
            terraform -chdir=infrastructure output -no-color
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify HTTPS and healthy Nginx target
        timeout-minutes: 15
        run: |
          target_group_arn=$(terraform -chdir=infrastructure output -raw target_group_arn)
          application_url=$(terraform -chdir=infrastructure output -raw application_url)
          aws elbv2 wait target-in-service --target-group-arn "$target_group_arn"
          curl --fail --silent --show-error --retry 30 --retry-delay 10 --retry-all-errors \
            "$application_url/" -o /tmp/deployed-index.html
          cmp app/index.html /tmp/deployed-index.html
          http_url="${application_url/https:/http:}/example?check=1"
          curl --silent --show-error --dump-header /tmp/redirect-headers --output /dev/null "$http_url"
          tr -d '\r' < /tmp/redirect-headers > /tmp/redirect-headers-clean
          grep -Eq '^HTTP/[0-9.]+ 301' /tmp/redirect-headers-clean
          grep -Fqi "location: $application_url:443/example?check=1" /tmp/redirect-headers-clean

      - name: Verify Terraform convergence
        run: terraform -chdir=infrastructure plan -input=false -detailed-exitcode
